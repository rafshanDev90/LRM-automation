<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{LAB_TITLE}}</title>
  <style>
    /* Clean Tech & Engineering Typography System */
    :root {
      --primary-color: #1a365d;
      --text-dark: #2d3748;
      --text-muted: #718096;
      --bg-code: #1e1e1e; /* Visual VS-Code dark token theme matching */
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    .header-block {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 24pt;
      margin: 0 0 10px 0;
    }

    h2 {
      color: var(--primary-color);
      font-size: 16pt;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
      margin-top: 25px;
    }

    h3 {
      font-size: 12pt;
      color: #4a5568;
      margin: 18px 0 8px 0;
    }

    h4 {
      font-size: 10pt;
      color: #2d3748;
      margin: 0 0 6px 0;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 10pt;
      color: var(--text-muted);
    }

    .generated-at {
      font-size: 9pt;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Table of contents listing every task in the lab */
    .task-index {
      margin-bottom: 30px;
    }

    .task-index h2 {
      margin-top: 0;
    }

    .task-index ol {
      list-style: none;
      counter-reset: none;
      margin: 0;
      padding: 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .task-index li {
      display: flex;
      gap: 12px;
      padding: 8px 12px;
      font-size: 10.5pt;
      border-bottom: 1px solid var(--border-color);
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .task-index li:last-child {
      border-bottom: none;
    }

    .task-index li:nth-child(even) {
      background: #f7fafc;
    }

    .toc-number {
      font-weight: 700;
      color: var(--primary-color);
      white-space: nowrap;
    }

    /* Task document blocks flow continuously; only content that does not fit wraps */
    .task-section {
      margin-bottom: 26px;
    }

    /* Visual separator between tasks without forcing a page break */
    .task-section + .task-section {
      border-top: 2px solid var(--border-color);
      padding-top: 22px;
      margin-top: 30px;
      page-break-before: auto;
      break-before: auto;
    }

    .task-header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 10px;
      page-break-after: avoid;
      break-after: avoid;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .task-header h2 {
      border: none;
      margin: 0;
      padding: 0;
    }

    .task-badge {
      background: var(--primary-color);
      color: #ffffff;
      font-size: 8.5pt;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .description-box {
      font-size: 11pt;
      margin-bottom: 10px;
      text-align: justify;
      white-space: pre-wrap;
      orphans: 3;
      widows: 3;
    }

    /* Code blocks may span pages so they never jump ahead and leave blank space */
    .code-section {
      margin-bottom: 20px;
      page-break-inside: auto;
      break-inside: auto;
    }

    /* Keep the file heading attached to the first lines of its code */
    .code-section h4 {
      page-break-after: avoid;
      break-after: avoid;
    }

    .lang-tag {
      display: inline-block;
      margin-left: 6px;
      vertical-align: 1px;
      font-size: 8pt;
      font-weight: 600;
      color: var(--text-muted);
      background: #edf2f7;
      border-radius: 3px;
      padding: 1px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Embedded Highlight.js visual styles */
    pre.hljs {
      background: var(--bg-code) !important;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 6px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 9.5pt;
      overflow: visible !important;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 0;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
      page-break-inside: auto;
      break-inside: auto;
      orphans: 3;
      widows: 3;
    }

    /* Essential Dark Token Palette Overrides */
    .hljs-keyword { color: #569cd6; font-weight: bold; }
    .hljs-string  { color: #ce9178; }
    .hljs-comment { color: #6a9955; font-style: italic; }
    .hljs-number  { color: #b5cea8; }
    .hljs-function{ color: #dcdcaa; }
    .hljs-title   { color: #4ec9b0; }

    .terminal-box {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 10pt;
      padding: 12px;
      border-radius: 4px;
      border-left: 4px solid #0ea5e9;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      page-break-inside: auto;
      break-inside: auto;
    }

    .empty-note {
      color: var(--text-muted);
      font-size: 10pt;
      margin: 0 0 10px 0;
    }

    /* Print-specific pagination controls */
    @page {
      size: A4;
    }

    @media print {
      h2, h3, h4 {
        page-break-after: avoid;
        break-after: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="header-block">
    <h1>{{LAB_TITLE}}</h1>
    <div class="meta-grid">
      <div><strong>Classification:</strong> Engineering / Software Lab Report</div>
      <div style="text-align: right;"><strong>Tasks:</strong> {{TASK_COUNT}}</div>
    </div>
    <div class="generated-at">Generated {{GENERATED_AT}}</div>
  </div>

  {{TASK_INDEX}}

  {{TASK_SECTIONS}}

</body>
</html>
