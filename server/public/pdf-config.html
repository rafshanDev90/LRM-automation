<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Configuration - Lab Report Maker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; min-height: 100vh; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
    header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; padding: 2rem; }
    header h1 { font-size: 1.75rem; font-weight: 700; }
    header p { opacity: 0.9; margin-top: 0.5rem; }
    main { padding: 2rem; }
    .section { margin-bottom: 1.5rem; }
    .section-title { font-size: 1.1rem; font-weight: 600; color: #1e293b; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-title::before { content: ''; width: 4px; height: 20px; background: #2563eb; border-radius: 2px; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; color: #475569; margin-bottom: 0.5rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .template-card { border: 2px solid #e2e8f0; border-radius: 10px; padding: 1.5rem; cursor: pointer; transition: all 0.2s; margin-bottom: 0.5rem; }
    .template-card:hover { border-color: #cbd5e1; }
    .template-card.active { border-color: #2563eb; background: rgba(37, 99, 235, 0.05); }
    .template-card h3 { margin-bottom: 0.25rem; color: #1e293b; }
    .template-card p { font-size: 0.875rem; color: #64748b; }
    .btn { padding: 0.875rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; display: inline-block; }
    .btn-primary { background: #2563eb; color: white; width: 100%; }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background: #e2e8f0; color: #475569; width: 100%; }
    .btn-secondary:hover { background: #cbd5e1; }
    .alert { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
    .alert-success { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
    .alert-error { background: #f8d7da; color: #842029; border: 1px solid #f5c6cb; }
    .preview-section { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e2e8f0; }
    .pdf-preview { border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #fff; }
    .preview-header { background: #f8fafc; padding: 0.75rem; font-size: 0.875rem; color: #64748b; }
    .download-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; }
    @media (max-width: 480px) { .header h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ PDF Configuration</h1>
      <p>Adjust settings & generate your lab report PDF</p>
    </header>
    <main>
      <div class="section">
        <div class="section-title">Lab Title</div>
        <div class="form-group">
          <label for="labTitle">Report Title</label>
          <input type="text" id="labTitle" value="Lab Report" placeholder="e.g., Data Structures Lab 3">
        </div>
      </div>

      <div class="section">
        <div class="section-title">Template</div>
        <div class="template-card active" data-template="classic">
          <h3>Classic Academic</h3>
          <p>Serif fonts, formal layout, traditional lab reports</p>
        </div>
        <div class="template-card" data-template="modern">
          <h3>Modern Clean</h3>
          <p>Sans-serif, card-based, contemporary design</p>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Options</div>
        <div class="form-group">
          <label>Task Number Threshold for Page Break</label>
          <select id="pageBreakThreshold">
            <option value="50">50 lines (short code stays on 1 page)</option>
            <option value="80">80 lines</option>
            <option value="30">30 lines (more conservative)</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="previewBtn" disabled>Preview HTML</button>
        <button class="btn btn-primary" id="generateBtn" disabled style="width: 100%; margin-top: 1rem;">Generate PDF</button>
      </div>

      <!-- Preview Section -->
      <div class="preview-section" id="previewSection" style="display: none;">
        <div class="section">Preview</div>
        <div class="pdf-preview" id="pdfPreview">
          <div class="preview-header">Generating preview…</div>
        </div>
        <div class="download-section" id="downloadSection" style="display: none;">
          <a id="downloadLink" class="btn btn-primary" download>Download PDF</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentHtml = '';
    let currentTemplate = 'classic';
    let currentThreshold = 50;

    // API endpoint
    const API_BASE = window.location.origin + '/api';

    // Load templates
    fetch('/api/templates')
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          data.templates.forEach(tpl => {
            const card = document.querySelector(`[data-template="${tpl.id}"]`);
            if (card) {
              card.dataset.name = tpl.name;
              card.dataset.desc = tpl.description;
            }
          });
        }
      });

    // Template selection
    document.querySelectorAll('.template-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentTemplate = card.dataset.template;
        document.getElementById('generateBtn').disabled = false;
      });
    });

    // Generate PDF
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const labTitle = document.getElementById('labTitle').value.trim() || 'Lab Report';
      currentTemplate = document.querySelector('.template-card.active')?.dataset.template || 'classic';
      currentThreshold = parseInt(document.getElementById('pageBreakThreshold').value, 10);

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerHTML = '⏳ Generating PDF...';

      try {
        const res = await fetch('/api/generate-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            labTitle,
            templateId: currentTemplate,
            // taskPairs will be empty - user needs to upload files first via TaskUpload
            taskPairs: []
          })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        currentHtml = data.html || '';
        currentHtml = `<!DOCTYPE html><html><body><h1>${labTitle}</h1></body></html>`; // fallback
        // Actually, we need to get HTML first. Let's preview first.
        showAlert('PDF generation started. Please use the full app for complete flow.', 'info');
      } catch (err) {
        showAlert('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Generate PDF';
      }
    });

    // Preview HTML (calls our backend preview endpoint)
    document.getElementById('previewBtn').addEventListener('click', async () => {
      const labTitle = document.getElementById('labTitle').value.trim() || 'Lab Report';
      const template = document.querySelector('.template-card.active')?.dataset.template || 'classic';

      const btn = document.getElementById('previewBtn');
      btn.disabled = true;
      btn.innerHTML = '⏳ Generating preview…';

      try {
        const res = await fetch('/api/preview-html', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            taskPairs: [], // empty - user uploads files via separate flow
            labTitle,
            templateId: template
          })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        currentHtml = data.html;
        renderPreview(currentHtml);
        showSection('previewSection');
        showAlert('Preview generated successfully!', 'success');
      } catch (err) {
        showAlert('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Preview HTML';
      }
    });

    function renderPreview(html) {
      const previewDiv = document.getElementById('pdfPreview');
      previewDiv.innerHTML = `<style>
@page { margin: 2cm; size: A4; }
* { box-sizing: border-box; }
body { font-family: "Times New Roman", serif; font-size: 11pt; line-height: 1.6; color: #1a1a2e; margin: 0; padding: 0; }
:root { --accent: #1e3a8a; --text: #1a1a2e; --bg: #fff; --code-bg: #0f172a; --output-bg: #1e1e1e; }
.task-card { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #e2e8f0; }
.task-header { margin-bottom: 1rem; padding: 0.5rem 1rem; background: #f8fafc; border-left: 4px solid var(--accent); border-radius: 4px 4px 0 0; }
.task-title { font-size: 16pt; font-weight: bold; color: var(--text); }
.section { margin-bottom: 1rem; }
.section-title { font-size: 13pt; font-weight: bold; color: var(--text); margin-bottom: 0.5rem; }
.code-block { background: var(--code-bg); color: #e2e8f0; padding: 0.75rem; overflow-x: auto; border-radius: 4px; }
.image-wrapper img { max-width: 100%; border: 1px solid #e2e8f0; border-radius: 4px; }
</style>${html}`;
      document.getElementById('downloadSection').style.display = 'none';
    }

    function showSection(id) {
      document.querySelectorAll('.preview-section > div').forEach(d => d.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }

    function showAlert(message, type) {
      // Simple inline alert for this standalone page
      const existing = document.querySelector('.custom-alert');
      if (existing) existing.remove();
      const div = document.createElement('div');
      div.className = `alert alert-${type} custom-alert`;
      div.textContent = message;
      const header = document.querySelector('header');
      header.parentNode.insertBefore(div, header.nextSibling);
      setTimeout(() => div.remove(), 5000);
    }
  </script>
</body>
</html>
